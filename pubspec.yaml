name: fox_sdk
description: A Flutter SDK and CLI for running apps, resolving platforms, and managing updates.
version: 0.1.0-alpha.2
homepage: https://gitlab.com/vedla/fox_sdk.git
repository: https://gitlab.com/vedla/fox_sdk.git


environment:
  sdk: ^3.11.0
  flutter: ">=3.40.0"

platforms:
  linux:
  macos:
  windows:


dependencies:
  args: ^2.7.0
  cli_completion: ^0.5.1
  flutter:
    sdk: flutter
  mason_logger: ^0.3.5
  pub_updater: ^0.5.0

dev_dependencies:
  build_runner: ^2.15.0
  build_verify: ^3.1.1
  build_version: ^2.1.3
  flutter_test:
    sdk: flutter
  import_order_lint: ^0.2.3
  melos: ^7.7.0
  test: any
  utopia_tui: ^2.0.0
  very_good_analysis: ^10.2.0

executables:
  fox:

workspace: []


# workspace:
melos:
  useRootAsPackage: true
  scripts:
    analyze: melos exec -- dart analyze . --fatal-infos
    fix: melos exec -- dart fix --apply
    lint: melos exec -- dart analyze . --fatal-infos --fatal-warnings
    format: melos exec -- dart format .
    docs: melos exec --dir-exists=lib -- "dart doc ."
    get: melos exec --flutter --concurrency=1 -- "flutter pub get"
    outdated: melos exec --flutter --concurrency=1 -- "flutter pub outdated"
    upgrade: melos exec --flutter --concurrency=1 -- "flutter pub upgrade --major-versions"
    clean: melos exec --flutter --concurrency=1 -- "flutter clean"
    sort: melos exec --flutter --concurrency=1 -- "dart run import_order_lint:import_order"
